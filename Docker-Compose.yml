services:
  frontend:
    build:
      context: ./frontend

    container_name: ConnectSphere-frontend

    image: connectsphere-frontend:dev

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  backend:
    build:
      context: ./backend

    container_name: ConnectSphere-backend

    image: connectsphere-backend:dev

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - .env
